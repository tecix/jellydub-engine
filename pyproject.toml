[project]
name = "jellydub"
version = "0.1.0"
description = "Offline AI dubbing (EN SRT -> Vietnamese audio track) for Jellyfin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "srt>=3.5",
    "edge-tts>=7.0",
    "typer>=0.12",
]

[project.optional-dependencies]
translate = ["transformers>=4.44", "sentencepiece>=0.2", "sacremoses>=0.1", "torch>=2.3"]
separate = ["audio-separator[cpu]>=0.30"]
vieneu = ["vieneu"]
opensubtitles = ["subliminal>=2.8"]
live = ["zeroconf>=0.130"]

[project.scripts]
jellydub = "jellydub.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jellydub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end test (needs ffmpeg + network for Edge-TTS)", "slow: downloads models"]
addopts = "-m 'not e2e and not slow'"

# CPU-only PyTorch by default (small download). For an NVIDIA GPU, remove this block or point
# the index at https://download.pytorch.org/whl/cu126 and re-run `uv sync --extra translate`.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
